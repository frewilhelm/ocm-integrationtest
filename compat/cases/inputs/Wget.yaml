# input:wget: fetch from local HTTP server. v2 has no plugin.
components:
- name: ocm.software/compat/input/wget
  version: 1.0.0
  provider:
    name: ocm.software
  labels:
  - name: compat.ocm.software/case
    value:
      id: input:wget
  - name: compat.ocm.software/fixtures
    value:
    - name: HTTP
      kind: httpFileServer
      with:
        files:
          payload.txt: "wget compat\n"
  - name: compat.ocm.software/expect
    value:
      construct:
        v1: pass
        v2:
          outcome: fail
          expectKind: v2:input_kind_unsupported
      transfer:
        v1: pass
        v2: skip
  resources:
  - name: r-wget
    type: plainText
    version: 1.0.0
    relation: local
    input:
      type: wget
      url: ${HTTP.payload.txt.url}
      mediaType: text/plain
