# input:file: single on-disk file; both legs supported.
components:
- name: ocm.software/compat/input/file
  version: 1.0.0
  provider:
    name: ocm.software
  labels:
  - name: compat.ocm.software/case
    value:
      id: input:file
  - name: compat.ocm.software/fixtures
    value:
    - name: file
      kind: writeFile
      with:
        path: payload.txt
        data: "file input compat\n"
  - name: compat.ocm.software/expect
    value:
      construct:
        v1: pass
        v2: pass
      transfer:
        v1: pass
        v2: pass
  resources:
  - name: r-file
    type: plainText
    version: 1.0.0
    relation: local
    input:
      type: file
      mediaType: text/plain
      path: ${file.path}
