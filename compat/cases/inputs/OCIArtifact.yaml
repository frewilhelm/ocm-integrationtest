# input:ociArtifact: pull tiny artifact from per-process registry. v2 has
# no plugin.
components:
- name: ocm.software/compat/input/ociartifact
  version: 1.0.0
  provider:
    name: ocm.software
  labels:
  - name: compat.ocm.software/case
    value:
      id: input:ociArtifact
  - name: compat.ocm.software/fixtures
    value:
    - name: image
      kind: ociArtifact
      with:
        repo: compat/input-oci
        tag: v1
        payload: "compat input oci\n"
  - name: compat.ocm.software/expect
    value:
      construct:
        v1: pass
        v2:
          outcome: fail
          expectKind: v2:input_kind_unsupported
      transfer:
        v1: pass
        v2: skip
  resources:
  - name: r-input-oci
    type: ociImage
    version: 1.0.0
    relation: local
    input:
      type: ociArtifact
      path: ${image.ref}
