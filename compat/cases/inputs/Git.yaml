# input:git: v1's git input shells out to `git`, which is not present in
# the ghcr.io/open-component-model/ocm image. Skipped both legs.
components:
- name: ocm.software/compat/input/git
  version: 1.0.0
  provider:
    name: ocm.software
  labels:
  - name: compat.ocm.software/case
    value:
      id: input:git
  - name: compat.ocm.software/expect
    value:
      construct:
        v1:
          outcome: skip
          reason: v1 git input requires `git` binary, not present in docker image
        v2:
          outcome: skip
          reason: no v2 plugin
      transfer:
        v1:
          outcome: skip
          reason: depends on construct
        v2:
          outcome: skip
          reason: depends on construct
  resources:
  - name: r-git
    type: plainText
    version: 1.0.0
    relation: local
    input:
      type: git
      repository: file:///placeholder
