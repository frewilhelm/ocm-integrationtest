# access:NPM: canonical NPM/v1 plus three spelling variants. v1 supports
# the type; v2 ships no NPM access plugin today, so every spelling fails
# with `failed to get plugin for typ "..."`. Once v2 implements the
# plugin, flip the v2 construct/transfer expectations to `pass`; all
# four spellings will pass together.
components:
- name: ocm.software/compat/access/npm
  version: 1.0.0
  provider:
    name: ocm.software
  labels:
  - name: compat.ocm.software/case
    value:
      id: access:NPM
  - name: compat.ocm.software/expect
    value:
      construct:
        v1: pass
        v2:
          outcome: fail
          expectKind: v2:access_plugin_missing
      transfer:
        v1: pass
        v2: skip
  resources:
  - name: r-npm-canonical
    type: npmPackage
    version: "5.0.0"
    relation: external
    access:
      type: NPM/v1
      registry: https://registry.npmjs.org
      package: yallist
      version: "5.0.0"
  - name: r-npm-canonical-noversion
    type: npmPackage
    version: "5.0.0"
    relation: external
    access:
      type: NPM
      registry: https://registry.npmjs.org
      package: yallist
      version: "5.0.0"
  - name: r-npm-lower-alias
    type: npmPackage
    version: "5.0.0"
    relation: external
    access:
      type: npm
      registry: https://registry.npmjs.org
      package: yallist
      version: "5.0.0"
  - name: r-npm-lower-v1-alias
    type: npmPackage
    version: "5.0.0"
    relation: external
    access:
      type: npm/v1
      registry: https://registry.npmjs.org
      package: yallist
      version: "5.0.0"
