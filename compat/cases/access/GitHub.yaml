# access:GitHub: canonical GitHub/v1 plus spelling variants. v1 supports
# the type; v2 ships no GitHub access plugin today, so every spelling
# fails with `failed to get plugin for typ "..."`. Once v2 implements
# the plugin, flip the v2 construct/transfer expectations to `pass`.
components:
- name: ocm.software/compat/access/github
  version: 1.0.0
  provider:
    name: ocm.software
  labels:
  - name: compat.ocm.software/case
    value:
      id: access:GitHub
  - name: compat.ocm.software/expect
    value:
      construct:
        v1: pass
        v2:
          outcome: fail
          expectKind: v2:access_plugin_missing
      transfer:
        v1: pass
        v2: skip
  resources:
  - name: r-gh-canonical
    type: source
    version: 6.7.1
    relation: external
    access:
      type: GitHub/v1
      repoUrl: https://github.com/stefanprodan/podinfo
      commit: 9bd1c2dab3d0b8527c12f8bcb716b1d40dbeed18
  - name: r-gh-canonical-noversion
    type: source
    version: 6.7.1
    relation: external
    access:
      type: GitHub
      repoUrl: https://github.com/stefanprodan/podinfo
      commit: 9bd1c2dab3d0b8527c12f8bcb716b1d40dbeed18
  - name: r-gh-camel-alias
    type: source
    version: 6.7.1
    relation: external
    access:
      type: gitHub
      repoUrl: https://github.com/stefanprodan/podinfo
      commit: 9bd1c2dab3d0b8527c12f8bcb716b1d40dbeed18
  - name: r-gh-camel-v1-alias
    type: source
    version: 6.7.1
    relation: external
    access:
      type: gitHub/v1
      repoUrl: https://github.com/stefanprodan/podinfo
      commit: 9bd1c2dab3d0b8527c12f8bcb716b1d40dbeed18
  - name: r-gh-lower-alias
    type: source
    version: 6.7.1
    relation: external
    access:
      type: github
      repoUrl: https://github.com/stefanprodan/podinfo
      commit: 9bd1c2dab3d0b8527c12f8bcb716b1d40dbeed18
