# access:S3: canonical S3/v1 plus three spelling variants. v1 supports
# the type; v2 ships no S3 access plugin today, so every spelling fails
# with `failed to get plugin for typ "..."`. Once v2 implements the
# plugin, flip the v2 construct/transfer expectations to `pass`.
#
# Bucket name `compat.s3` deliberately contains a dot so aws-sdk-go-v2 falls
# back to path-style addressing (no env knob for UsePathStyle).
components:
- name: ocm.software/compat/access/s3
  version: 1.0.0
  provider:
    name: ocm.software
  labels:
  - name: compat.ocm.software/case
    value:
      id: access:S3
  - name: compat.ocm.software/fixtures
    value:
      - name: S3
        kind: s3
        with:
          bucket: compat.s3
          key: payload.txt
          region: us-east-1
          payload: "compat access:S3\n"
  - name: compat.ocm.software/expect
    value:
      construct:
        v1: pass
        v2:
          outcome: fail
          expectKind: v2:access_plugin_missing
      transfer:
        v1: pass
        v2: skip
  resources:
  - name: r-s3-canonical
    type: blob
    version: 1.0.0
    relation: external
    access:
      type: S3/v1
      region: ${S3.region}
      bucket: ${S3.bucket}
      key: ${S3.key}
  - name: r-s3-canonical-noversion
    type: blob
    version: 1.0.0
    relation: external
    access:
      type: S3
      region: ${S3.region}
      bucket: ${S3.bucket}
      key: ${S3.key}
  - name: r-s3-lower-alias
    type: blob
    version: 1.0.0
    relation: external
    access:
      type: s3
      region: ${S3.region}
      bucket: ${S3.bucket}
      key: ${S3.key}
  - name: r-s3-lower-v1-alias
    type: blob
    version: 1.0.0
    relation: external
    access:
      type: s3/v1
      region: ${S3.region}
      bucket: ${S3.bucket}
      key: ${S3.key}
